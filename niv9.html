<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('err');
  if (el) { el.style.display = 'block'; el.textContent = 'ERREUR: ' + e.message; }
});

var KEY = 'mdpc_v90';
var state = { currentUser: null, users: {} };
try { var raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw); } catch (e) {}

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} header(); }
function user() { return state.currentUser ? state.users[state.currentUser] : null; }
function mkUser(n) { return { name: n, done: {}, certs: [], examens: {}, jours: {}, created: new Date().toISOString().slice(0,10) }; }
function today() { return new Date().toISOString().slice(0,10); }

function countDone(lvl) {
  var u = user(); if (!u) return 0;
  var c = 0, p = lvl + '_';
  for (var k in u.done) { if (k.indexOf(p) === 0 && u.done[k]) c++; }
  return c;
}
function isComplete(lvl) { return countDone(lvl) >= 10; }
function isUnlocked(lvl) { if (lvl === 1) return true; return isComplete(lvl - 1); }

function simulate() {
  var u = user(); if (!u) return;
  for (var i = 1; i <= 10; i++) {
    u.done['1_'+i]=true; u.done['2_'+i]=true; u.done['3_'+i]=true;
    u.done['4_'+i]=true; u.done['5_'+i]=true; u.done['6_'+i]=true;
    u.done['7_'+i]=true; u.done['8_'+i]=true;
  }
  save();
  alert('N1-N8 simulés. Niveau 9 débloqué !');
  route();
}

function login() {
  var el = document.getElementById('loginName'); if (!el) return;
  var n = el.value.trim(); if (!n) { alert('Entre ton prénom'); return; }
  var k = n.toLowerCase().replace(/\s+/g, '_');
  if (!state.users[k]) state.users[k] = mkUser(n);
  state.currentUser = k; save(); go('home');
}
function logout() { state.currentUser = null; save(); go('login'); }
function go(h) { location.hash = h; }

var DEFIS = [
{id:1, titre:"Introduction au Cloud Computing", intro:"Le cloud a transformé l informatique. Comprendre ses fondamentaux est indispensable pour toute carrière moderne.",
cours:"<h3>Qu est-ce que le Cloud</h3><p><strong>Cloud Computing</strong> = mise à disposition de ressources informatiques (serveurs, stockage, réseau) via Internet, à la demande, avec facturation à l usage.</p><h3>Les 5 caractéristiques NIST</h3><ul><li><strong>Self-service</strong> — provisionner sans intervention humaine</li><li><strong>Accès réseau large</strong> — accessible partout</li><li><strong>Mutualisation</strong> — ressources partagées entre clients</li><li><strong>Élasticité</strong> — augmenter/diminuer automatiquement</li><li><strong>Facturation à l usage</strong> — payer ce qu on consomme</li></ul><h3>Pourquoi le Cloud</h3><ul><li>Pas d investissement matériel (CapEx → OpEx)</li><li>Scalabilité immédiate</li><li>Accès mondial</li><li>Maintenance déléguée</li><li>Innovation rapide</li></ul><h3>Les acteurs majeurs</h3><table><tr><th>Fournisseur</th><th>Part de marché</th></tr><tr><td>AWS (Amazon)</td><td>~32%</td></tr><tr><td>Azure (Microsoft)</td><td>~23%</td></tr><tr><td>GCP (Google)</td><td>~10%</td></tr><tr><td>Alibaba Cloud</td><td>~4%</td></tr><tr><td>OVHcloud (EU)</td><td>~2%</td></tr></table><h3>Risques</h3><ul><li>Dépendance au fournisseur (vendor lock-in)</li><li>Souveraineté des données</li><li>Sécurité partagée (responsabilité)</li><li>Factures imprévues</li><li>Conformité réglementaire</li></ul><div class=\"box\">Le cloud = louer une cuisine professionnelle au lieu d en construire une. Vous payez à l heure, vous cuisinez ce que vous voulez.</div><div class=\"bank\">Banques : cloud hybride majoritaire. Données critiques on-premise, services annexes dans le cloud. BCEAO impose des règles de localisation.</div><div class=\"warn\">« Cloud » ne signifie pas « plus sécurisé ». La sécurité dépend de la CONFIGURATION, pas du fournisseur.</div>",
cas:"<h3>Cas 1 — Choisir un fournisseur</h3><ul><li>Besoin : héberger une API bancaire</li><li>Critères : conformité BCEAO, localisation, chiffrement, certifications (ISO 27001, SOC 2)</li><li>Option : cloud privé + hybride avec un fournisseur certifié</li></ul><h3>Cas 2 — Estimer un coût</h3><p>1 VM 4 vCPU / 16 Go RAM / 100 Go SSD pendant 1 mois :</p><ul><li>AWS EC2 t3.xlarge : ~120 USD</li><li>Azure Standard_D4s_v3 : ~140 USD</li><li>GCP n2-standard-4 : ~110 USD</li></ul><p>+ trafic sortant, stockage, snapshots, IP publique...</p><h3>Cas 3 — Vendor lock-in</h3><p>Utiliser des services managés spécifiques (Lambda, SQS) crée une dépendance. Alternative : conteneurs Docker + Kubernetes (portable).</p>",
quiz:[
{q:'Cloud = ?',o:['Ressources à la demande','Antivirus','Chiffrement','Pare-feu'],c:0,e:'À la demande.'},
{q:'NIST définit ?',o:['5 caractéristiques','3 lois','2 modèles','1 outil'],c:0,e:'5 caractéristiques.'}
]},

{id:2, titre:"Modèles de service — IaaS, PaaS, SaaS", intro:"Le cloud offre 3 grands modèles de service. Comprendre la différence est fondamental pour choisir la bonne architecture.",
cours:"<h3>Les 3 modèles</h3><table><tr><th>Modèle</th><th>Vous gérez</th><th>Fournisseur gère</th><th>Exemple</th></tr><tr><td><strong>IaaS</strong></td><td>OS, apps, données</td><td>Matériel, réseau, virtualisation</td><td>AWS EC2, Azure VM</td></tr><tr><td><strong>PaaS</strong></td><td>Apps, données</td><td>OS, runtime, infra</td><td>Heroku, App Engine</td></tr><tr><td><strong>SaaS</strong></td><td>Données utilisateur</td><td>Tout le reste</td><td>Gmail, Salesforce, M365</td></tr></table><h3>Analogie pizza</h3><ul><li><strong>IaaS</strong> = pâte + ingrédients fournis, vous cuisinez</li><li><strong>PaaS</strong> = pizza surgelée, vous chauffez</li><li><strong>SaaS</strong> = pizza livrée, vous mangez</li><li><strong>On-premise</strong> = vous cultivez le blé</li></ul><h3>IaaS</h3><ul><li>Contrôle maximal</li><li>Responsabilité sécurité maximale</li><li>Idéal pour : bases de données sensibles, legacy</li><li>Exemples : AWS EC2, Azure VM, GCP Compute Engine, OVH</li></ul><h3>PaaS</h3><ul><li>Compromis contrôle / simplicité</li><li>Le fournisseur gère l OS et le runtime</li><li>Idéal pour : développeurs, prototypage</li><li>Exemples : Heroku, Google App Engine, Azure App Service, AWS Elastic Beanstalk</li></ul><h3>SaaS</h3><ul><li>Aucun contrôle technique</li><li>Responsabilité limitée à l usage</li><li>Idéal pour : productivité, emails, CRM</li><li>Exemples : Gmail, Microsoft 365, Salesforce, Zoom, Dropbox</li></ul><h3>Serverless (FaaS)</h3><ul><li>Fonctions exécutées à la demande</li><li>Pas de serveur à gérer</li><li>Facturation à l exécution (millisecondes)</li><li>Exemples : AWS Lambda, Azure Functions, GCP Cloud Functions</li></ul><h3>FaaS vs PaaS</h3><p>PaaS = un serveur toujours actif. FaaS = du code qui s exécute SEULEMENT quand on l appelle. Idéal pour tâches ponctuelles.</p><div class=\"box\">Plus vous montez (IaaS→PaaS→SaaS), moins vous gérez, plus vous déléguez. Mais aussi : moins de contrôle, plus de dépendance.</div><div class=\"bank\">Banques : IaaS pour le core banking (contrôle total), SaaS pour M365/Gmail (productivité), PaaS pour les APIs modernes.</div><div class=\"warn\">En SaaS, la fuite de données reste VOTRE responsabilité (RGPD, BCEAO). Le fournisseur ne vous sauve pas.</div>",
cas:"<h3>Cas 1 — Choisir le bon modèle</h3><table><tr><th>Besoin</th><th>Modèle</th></tr><tr><td>Base de données bancaire</td><td>IaaS</td></tr><tr><td>Site vitrine</td><td>PaaS</td></tr><tr><td>Messagerie entreprise</td><td>SaaS</td></tr><tr><td>API de notification</td><td>FaaS</td></tr><tr><td>CRM commercial</td><td>SaaS</td></tr></table><h3>Cas 2 — Sécurité selon le modèle</h3><ul><li>IaaS : vous patchez l OS, configurez le pare-feu, chiffrez le disque</li><li>PaaS : vous gérez les secrets, l auth, les données</li><li>SaaS : vous gérez les accès, la MFA, la configuration de partage</li></ul><h3>Cas 3 — Lambda serverless</h3><pre>def lambda_handler(event, context):\n    # Traiter une demande de virement\n    return {\"statusCode\": 200}</pre><p>Code exécuté seulement à l appel. Pas de serveur à patcher.</p>",
quiz:[
{q:'IaaS = ?',o:['Tout géré par vous','Matériel géré par le fournisseur','Tout géré par le fournisseur','Aucun service'],c:1,e:'Matériel.'},
{q:'SaaS exemple ?',o:['AWS EC2','Heroku','Gmail','Docker'],c:2,e:'Gmail.'}
]},

{id:3, titre:"Modèles de déploiement", intro:"Public, privé, hybride, communautaire : chaque modèle a ses avantages, inconvénients et cas d usage.",
cours:"<h3>Les 4 modèles</h3><table><tr><th>Modèle</th><th>Description</th></tr><tr><td><strong>Public</strong></td><td>Ressources partagées, accessibles via Internet (AWS, Azure)</td></tr><tr><td><strong>Privé</strong></td><td>Ressources dédiées à une organisation (on-premise ou hosted)</td></tr><tr><td><strong>Hybride</strong></td><td>Combinaison public + privé</td></tr><tr><td><strong>Communautaire</strong></td><td>Partagé entre organisations d un même secteur (ex : banques)</td></tr></table><h3>Cloud Public</h3><ul><li>Avantages : coût, élasticité, maintenance déléguée</li><li>Inconvénients : sécurité, souveraineté, conformité</li><li>Utilisé pour : sites web, apps grand public, dev</li></ul><h3>Cloud Privé</h3><ul><li>Avantages : contrôle total, sécurité renforcée, conformité</li><li>Inconvénients : coût élevé, maintenance à charge</li><li>Utilisé pour : données bancaires critiques, ERP, legacy</li><li>Technologies : VMware, OpenStack, Proxmox</li></ul><h3>Cloud Hybride</h3><ul><li>Avantages : flexibilité + sécurité</li><li>Inconvénients : complexité de gestion</li><li>Utilisé pour : banques (données critiques privé, services annexes public)</li><li>Technologies : Azure Arc, AWS Outposts, Google Anthos</li></ul><h3>Multicloud</h3><p>Utiliser plusieurs fournisseurs publics (AWS + Azure + GCP). Évite le vendor lock-in mais augmente la complexité.</p><h3>Contexte ivoirien</h3><ul><li><strong>BCEAO</strong> — règles strictes sur localisation des données bancaires</li><li><strong>ARTCI</strong> — régulation télécoms et données personnelles</li><li>Cloud privé + hybride souvent privilégiés</li><li>Datacenters locaux émergents (Orange, MTN, Africa Data Centres)</li></ul><div class=\"box\">Choisir un modèle cloud = choisir un logement. Public = colocation (moins cher, partagé). Privé = appart (plus cher, à vous). Hybride = appart + maison de campagne.</div><div class=\"bank\">Banques : Hybride obligatoire. Données clients et core banking en privé, apps mobiles et web en public, avec chiffrement entre les deux.</div><div class=\"warn\">Le cloud public n est PAS interdit en banque, mais doit respecter la réglementation locale (localisation, chiffrement, audit).</div>",
cas:"<h3>Cas 1 — Architecture bancaire hybride</h3><ul><li><strong>Cloud privé</strong> : core banking, base de données clients, HSM</li><li><strong>Cloud public</strong> : site web, app mobile backend, CDN</li><li><strong>Connexion</strong> : VPN chiffré, MFA, monitoring</li><li><strong>Données</strong> : chiffrées en transit et au repos</li></ul><h3>Cas 2 — Migration progressive</h3><ol><li>Inventaire des applications</li><li>Classer : garder privé / migrer public / refactoriser</li><li>Migrer d abord les apps non critiques</li><li>Monitorer, optimiser, migrer le reste</li></ol><h3>Cas 3 — Multicloud</h3><p>Utiliser Azure pour M365 + AWS pour l infrastructure + GCP pour BigQuery. Avantage : résilience. Inconvénient : 3 fois plus d experts à former.</p>",
quiz:[
{q:'Cloud hybride = ?',o:['100% public','100% privé','Mix public + privé','Rien'],c:2,e:'Mix.'},
{q:'Banque utilise surtout ?',o:['Public seul','Hybride','Privé seul','Aucun'],c:1,e:'Hybride.'}
]},

{id:4, titre:"Sécurité du Cloud — Responsabilité partagée", intro:"Le modèle de responsabilité partagée est LA clé de la sécurité cloud. Comprendre qui protège quoi évite les catastrophes.",
cours:"<h3>Modèle de responsabilité partagée</h3><p>En cloud, la sécurité est <strong>partagée</strong> entre le fournisseur et le client. Une confusion = faille majeure.</p><h3>Ce que le fournisseur protège (Security OF the cloud)</h3><ul><li>Datacenters physiques</li><li>Réseau mondial</li><li>Hyperviseur (virtualisation)</li><li>Stockage physique</li><li>Isolation entre clients</li></ul><h3>Ce que le client protège (Security IN the cloud)</h3><ul><li>Données (chiffrement)</li><li>Identités (IAM, MFA)</li><li>Applications (code sécurisé)</li><li>Configuration réseau (pare-feu, VPC)</li><li>Systèmes d exploitation (patchs)</li><li>Accès (utilisateurs, permissions)</li></ul><h3>Selon le modèle</h3><table><tr><th>Modèle</th><th>Client gère</th></tr><tr><td>IaaS</td><td>OS, apps, données, réseau config</td></tr><tr><td>PaaS</td><td>Apps, données, accès</td></tr><tr><td>SaaS</td><td>Accès, données utilisateur</td></tr></table><h3>Les 3 grandes erreurs</h3><ul><li><strong>Bucket S3 public</strong> — données exposées sur Internet</li><li><strong>Base de données sans MFA</strong> — compte compromis</li><li><strong>Clé API en clair</strong> — sur GitHub ou dans le code</li></ul><h3>Outils de sécurité cloud</h3><ul><li><strong>CSPM</strong> — Cloud Security Posture Management (Prisma Cloud, Wiz)</li><li><strong>CASB</strong> — Cloud Access Security Broker</li><li><strong>CWPP</strong> — Cloud Workload Protection Platform</li><li><strong>SASE</strong> — Secure Access Service Edge</li></ul><div class=\"box\">Le fournisseur sécurise la serrure de la porte. Vous devez fermer la porte à clé. Si vous laissez ouvert, ce n est pas la faute du fournisseur.</div><div class=\"bank\">Banques : la majorité des fuites cloud viennent d une mauvaise configuration CLIENT (bucket public, MFA manquant). Pas du fournisseur.</div><div class=\"warn\">« C est dans le cloud, donc c est sécurisé » = FAUX. C est une des phrases les plus dangereuses en IT.</div>",
cas:"<h3>Cas 1 — Bucket S3 public (catastrophe classique)</h3><ol><li>Développeur crée un bucket S3 pour stocker des images</li><li>Configuration par défaut : privé</li><li>Développeur le rend public pour simplifier</li><li>Met aussi des fichiers contenant des données clients</li><li>Un chercheur en sécurité le trouve</li><li>Fuite de millions d enregistrements</li></ol><p>Responsabilité : 100% client. Le fournisseur n a rien fait de mal.</p><h3>Cas 2 — Vérifier une config AWS</h3><ul><li>AWS Config : audit continu</li><li>Security Hub : score de sécurité</li><li>IAM Access Analyzer : détecter accès public</li><li>Trusted Advisor : recommandations</li></ul><h3>Cas 3 — Scan CSPM</h3><p>Utiliser un outil CSPM qui scanne automatiquement : buckets publics, MFA manquant, chiffrement désactivé, ports ouverts, IAM trop permissif.</p>",
quiz:[
{q:'Modèle responsabilité ?',o:['Partagée','100% fournisseur','100% client','Aucune'],c:0,e:'Partagée.'},
{q:'Bucket S3 public = ?',o:['Sûr','Erreur client','Normal','Rien'],c:1,e:'Erreur.'}
]},

{id:5, titre:"IAM — Gestion des identités Cloud", intro:"IAM (Identity and Access Management) est le cœur de la sécurité cloud. Mal configuré = compromission totale.",
cours:"<h3>Qu est-ce que IAM</h3><p><strong>IAM</strong> = gestion des identités et des accès. Qui peut faire quoi sur quoi.</p><h3>Concepts clés</h3><ul><li><strong>Utilisateur</strong> — une personne (ou un programme)</li><li><strong>Groupe</strong> — ensemble d utilisateurs</li><li><strong>Rôle</strong> — ensemble de permissions (assumable)</li><li><strong>Policy</strong> — document JSON qui définit les permissions</li><li><strong>MFA</strong> — second facteur obligatoire</li><li><strong>Service Account</strong> — compte technique pour applications</li></ul><h3>Principe de moindre privilège</h3><p>Chaque identité doit avoir UNIQUEMENT les permissions nécessaires, RIEN de plus.</p><h3>Bonnes pratiques IAM</h3><ul><li>MFA obligatoire sur TOUS les comptes</li><li>Pas de compte root utilisé au quotidien</li><li>Clés d accès (access keys) avec rotation</li><li>Rôles temporaires plutôt que clés permanentes</li><li>Principe du moindre privilège</li><li>Audit régulier des permissions</li><li>Suppression immédiate des comptes inactifs</li><li>Alertes sur actions sensibles</li></ul><h3>Erreurs courantes</h3><ul><li><strong>Clé root exposée</strong> — compromission totale</li><li><strong>Politique *:*</strong> — permissions admin à un compte technique</li><li><strong>Clé API sur GitHub</strong> — bots exploitent en 30 secondes</li><li><strong>MFA manquant</strong> — brute force possible</li><li><strong>Utilisateur partagé</strong> — impossible de tracer</li></ul><h3>Format Policy AWS</h3><pre>{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Allow\",\n    \"Action\": \"s3:GetObject\",\n    \"Resource\": \"arn:aws:s3:::my-bucket/*\"\n  }]\n}</pre><div class=\"box\">IAM = le videur d une boîte de nuit cloud. Il vérifie qui entre (identité) et ce qu il peut faire (permissions).</div><div class=\"bank\">Banques : chaque application a son propre rôle IAM avec permissions minimales. Aucune clé partagée. MFA sur tout compte humain.</div><div class=\"warn\">Une clé AWS trouvée sur GitHub = facture de 100 000 USD en quelques heures (minage crypto).</div>",
cas:"<h3>Cas 1 — Clé AWS sur GitHub</h3><ol><li>Développeur push une clé AWS par erreur</li><li>Bots scannent GitHub 24/7</li><li>Clé utilisée en 30 secondes pour miner du Bitcoin</li><li>Facture explose : milliers de dollars</li><li>Réaction : révoquer clé, auditer CloudTrail, changer toutes les clés</li></ol><h3>Cas 2 — Policy trop permissive</h3><pre>// MAUVAIS\n{\"Effect\": \"Allow\", \"Action\": \"*\", \"Resource\": \"*\"}\n\n// BON\n{\"Effect\": \"Allow\", \"Action\": \"s3:GetObject\", \"Resource\": \"arn:aws:s3:::my-bucket/*\"}</pre><h3>Cas 3 — Audit IAM</h3><ul><li>Lister les utilisateurs sans MFA</li><li>Lister les clés de plus de 90 jours</li><li>Lister les policies avec *</li><li>Supprimer les comptes inactifs 90j</li></ul>",
quiz:[
{q:'IAM signifie ?',o:['Identity and Access Management','Internet Access Manager','Integrated Auth Module','Aucun'],c:0,e:'Identity Access.'},
{q:'Moindre privilège ?',o:['Tous les droits','Minimum nécessaire','Rien','Aléatoire'],c:1,e:'Minimum.'}
]},

{id:6, titre:"Conteneurs et Docker", intro:"Les conteneurs ont révolutionné le déploiement. Comprendre Docker est indispensable pour tout DevSecOps moderne.",
cours:"<h3>Qu est-ce qu un conteneur</h3><p><strong>Conteneur</strong> = environnement isolé qui package une application + ses dépendances. Léger et portable.</p><h3>VM vs Conteneur</h3><table><tr><th>Critère</th><th>VM</th><th>Conteneur</th></tr><tr><td>Taille</td><td>Plusieurs Go</td><td>Quelques Mo</td></tr><tr><td>Démarrage</td><td>Minutes</td><td>Secondes</td></tr><tr><td>Isolation</td><td>Forte (hyperviseur)</td><td>Processus (moins forte)</td></tr><tr><td>OS</td><td>Complet</td><td>Partagé</td></tr><tr><td>Portabilité</td><td>Moyenne</td><td>Excellente</td></tr></table><h3>Docker</h3><ul><li><strong>Dockerfile</strong> — recette de construction</li><li><strong>Image</strong> — snapshot immuable</li><li><strong>Conteneur</strong> — instance d une image</li><li><strong>Registry</strong> — dépôt d images (Docker Hub)</li><li><strong>Compose</strong> — orchestrer plusieurs conteneurs</li></ul><h3>Commandes Docker essentielles</h3><pre>docker build -t mon-app:1.0 .\ndocker run -p 8080:80 mon-app:1.0\ndocker ps\ndocker logs mon-app\ndocker exec -it mon-app bash\ndocker stop mon-app\ndocker push registry.io/mon-app:1.0</pre><h3>Dockerfile exemple</h3><pre>FROM node:20-alpine\nWORKDIR /app\nCOPY package.json .\nRUN npm install --production\nCOPY . .\nUSER node\nEXPOSE 3000\nCMD [\"node\", \"server.js\"]</pre><h3>Sécurité des conteneurs</h3><ul><li><strong>Image de base</strong> : à jour, officielle, minimale (alpine)</li><li><strong>Utilisateur non-root</strong> : USER node</li><li><strong>Secrets</strong> : jamais dans l image, utiliser secrets manager</li><li><strong>Scan</strong> : Trivy, Grype, Clair</li><li><strong>Signature</strong> : cosign, Notary</li><li><strong>Réseau</strong> : minimal, isolé</li><li><strong>Read-only</strong> : filesystem en lecture seule</li></ul><div class=\"box\">Une VM = une maison individuelle. Un conteneur = un appartement. Plus léger, plus rapide, mais aussi : voisins plus proches (isolation moindre).</div><div class=\"bank\">Banques : conteneurs pour les APIs, Kubernetes pour l orchestration. Le core banking reste souvent en VM pour conformité.</div><div class=\"warn\">Un conteneur n est PAS une sandbox. Un conteneur compromis peut attaquer l hôte si mal configuré.</div>",
cas:"<h3>Cas 1 — Dockerfile sécurisé</h3><ul><li>Image de base : alpine ou distroless (pas ubuntu complet)</li><li>USER non-root</li><li>Pas de secrets en dur</li><li>Versions épinglées (node:20.10, pas node:latest)</li><li>Multi-stage build pour réduire la taille</li></ul><h3>Cas 2 — Scanner une image</h3><pre>trivy image mon-app:1.0</pre><p>Résultat : liste des CVE dans les dépendances. Corriger : mettre à jour les packages.</p><h3>Cas 3 — Compose</h3><pre>version: '3'\nservices:\n  app:\n    build: .\n    ports: [\"8080:3000\"]\n  db:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD_FILE: /run/secrets/db_pass</pre>",
quiz:[
{q:'Conteneur vs VM ?',o:['Plus léger','Plus lourd','Identique','Inutile'],c:0,e:'Léger.'},
{q:'Dockerfile sert à ?',o:['Construire image','Router','Chiffrer','Scanner'],c:0,e:'Image.'}
]},

{id:7, titre:"Kubernetes — Orchestration de conteneurs", intro:"Kubernetes (K8s) orchestre des milliers de conteneurs. C est le standard de facto pour la production.",
cours:"<h3>Qu est-ce que Kubernetes</h3><p><strong>Kubernetes</strong> = orchestrateur de conteneurs. Il gère le déploiement, la mise à l échelle, la résilience, le réseau.</p><h3>Concepts clés</h3><ul><li><strong>Pod</strong> — plus petite unité (1+ conteneurs)</li><li><strong>Deployment</strong> — gère les pods (replicas, rolling update)</li><li><strong>Service</strong> — expose un pod sur le réseau</li><li><strong>Ingress</strong> — routage HTTP externe</li><li><strong>ConfigMap</strong> — configuration non secrète</li><li><strong>Secret</strong> — configuration sensible (base64, pas chiffré par défaut)</li><li><strong>Namespace</strong> — isolation logique</li><li><strong>Node</strong> — serveur worker</li><li><strong>Cluster</strong> — ensemble de nœuds</li></ul><h3>Commandes kubectl</h3><pre>kubectl get pods\nkubectl get deployments\nkubectl logs mon-pod\nkubectl exec -it mon-pod -- bash\nkubectl apply -f deploy.yaml\nkubectl delete pod mon-pod\nkubectl describe pod mon-pod</pre><h3>YAML Deployment</h3><pre>apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: mon-app\nspec:\n  replicas: 3\n  selector:\n    matchLabels: {app: mon-app}\n  template:\n    metadata:\n      labels: {app: mon-app}\n    spec:\n      containers:\n      - name: mon-app\n        image: mon-app:1.0\n        ports: [{containerPort: 3000}]</pre><h3>Sécurité Kubernetes</h3><ul><li><strong>RBAC</strong> — Role-Based Access Control (qui peut faire quoi)</li><li><strong>Network Policies</strong> — isolation réseau entre pods</li><li><strong>Pod Security Standards</strong> — restrictions sur les pods</li><li><strong>Secrets</strong> — chiffrés au repos (ETCD encryption)</li><li><strong>Admission controllers</strong> — validation des déploiements</li><li><strong>Scan des images</strong> — avant déploiement</li><li><strong>Audit logs</strong> — obligatoires</li></ul><div class=\"box\">Kubernetes = un chef d orchestre. Il décide quel musicien joue quand, remplace les absents, ajuste le volume. Les conteneurs sont les musiciens.</div><div class=\"bank\">Banques : Kubernetes pour les APIs et services digitaux. Core banking rarement sur K8s (trop critique).</div><div class=\"warn\">Un cluster K8s mal configuré est une cible de choix. RBAC trop permissif = compromission totale.</div>",
cas:"<h3>Cas 1 — RBAC minimal</h3><pre>apiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  namespace: prod\n  name: pod-reader\nrules:\n- apiGroups: [\"\"]\n  resources: [\"pods\"]\n  verbs: [\"get\", \"list\"]</pre><h3>Cas 2 — Network Policy</h3><pre>apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: deny-all\nspec:\n  podSelector: {}\n  policyTypes: [Ingress, Egress]</pre><p>Par défaut, refuse tout. Puis autoriser au cas par cas.</p><h3>Cas 3 — Scan d un cluster</h3><ul><li><strong>kube-bench</strong> — CIS Kubernetes Benchmark</li><li><strong>kube-hunter</strong> — scan de vulnérabilités</li><li><strong>Trivy</strong> — scan des images</li><li><strong>Falco</strong> — détection runtime</li></ul>",
quiz:[
{q:'Kubernetes orchestre ?',o:['Conteneurs','VM','Réseau seul','Rien'],c:0,e:'Conteneurs.'},
{q:'RBAC ?',o:['Role-Based Access','Random','Route','Rien'],c:0,e:'Role-Based.'}
]},

{id:8, titre:"CI/CD et DevSecOps", intro:"DevSecOps intègre la sécurité DÈS LE DÉBUT du cycle de développement. Fini le « on verra après ».",
cours:"<h3>Qu est-ce que CI/CD</h3><ul><li><strong>CI</strong> (Continuous Integration) — intégration continue du code</li><li><strong>CD</strong> (Continuous Delivery/Deployment) — livraison/déploiement continu</li></ul><h3>Pipeline typique</h3><ol><li>Développeur push sur Git</li><li>Build automatique</li><li>Tests unitaires</li><li>Scan sécurité (SAST, dépendances)</li><li>Build image Docker</li><li>Scan image (Trivy)</li><li>Push registry</li><li>Déploiement staging</li><li>Tests</li><li>Déploiement production</li></ol><h3>DevSecOps</h3><p><strong>DevSecOps</strong> = DevOps + sécurité intégrée. La sécurité n est plus un frein mais un accélérateur.</p><h3>Shift Left</h3><p>Détecter les failles LE PLUS TÔT possible. Une faille détectée en dev coûte 100x moins cher qu en production.</p><h3>Outils sécurité pipeline</h3><table><tr><th>Type</th><th>Outils</th></tr><tr><td><strong>SAST</strong> — code source</td><td>SonarQube, Semgrep, CodeQL</td></tr><tr><td><strong>DAST</strong> — app en cours</td><td>OWASP ZAP, Burp</td></tr><tr><td><strong>SCA</strong> — dépendances</td><td>Dependabot, Snyk, OWASP DC</td></tr><tr><td><strong>Secrets scan</strong></td><td>git-secrets, gitleaks, trufflehog</td></tr><tr><td><strong>Container scan</strong></td><td>Trivy, Grype, Clair</td></tr><tr><td><strong>IaC scan</strong></td><td>Checkov, tfsec, KICS</td></tr></table><h3>Exemple pipeline GitLab CI</h3><pre>stages: [build, test, security, deploy]\nbuild:\n  script: docker build -t app .\ntest:\n  script: npm test\nsast:\n  script: semgrep --config=auto\nsca:\n  script: snyk test\ncontainer_scan:\n  script: trivy image app\ndeploy:\n  script: kubectl apply -f deploy.yaml</pre><div class=\"box\">DevSecOps = conduire une voiture avec freins ABS + airbags + radar. La sécurité n empêche pas de rouler, elle permet de rouler plus vite en sécurité.</div><div class=\"bank\">Banques : pipeline DevSecOps obligatoire. Aucun code ne va en prod sans scan sécurité automatique.</div><div class=\"warn\">« On ajoutera la sécurité après » = dette technique + failles en prod. Shift Left ou rien.</div>",
cas:"<h3>Cas 1 — Pipeline sécurisé</h3><pre>stages:\n  - lint\n  - test\n  - sast\n  - sca\n  - container_scan\n  - deploy\n\nsast:\n  image: returntocorp/semgrep\n  script: semgrep --config=p/security-audit --error\n\nsca:\n  script: npm audit --audit-level=high\n\ncontainer_scan:\n  image: aquasec/trivy\n  script: trivy image --exit-code 1 --severity HIGH,CRITICAL app:latest</pre><p>Si une faille critique est détectée, le pipeline échoue. Impossible de déployer.</p><h3>Cas 2 — Scan secrets</h3><pre>gitleaks detect --source . --verbose</pre><p>Détecte les clés API, mots de passe, tokens dans le code.</p><h3>Cas 3 — Dependabot</h3><p>Active les alertes automatiques sur les dépendances vulnérables. Crée automatiquement des PR de mise à jour.</p>",

{id:9, titre:"Infrastructure as Code (IaC) et Terraform", intro:"IaC permet de décrire l infrastructure dans du code. Terraform est le standard de facto.",
cours:"<h3>Qu est-ce que IaC</h3><p><strong>IaC</strong> = Infrastructure as Code. Décrire l infrastructure (serveurs, réseaux, bases) dans des fichiers texte versionnés.</p><h3>Avantages</h3><ul><li>Reproductibilité (même infra partout)</li><li>Versionnement (Git)</li><li>Automatisation</li><li>Documentation vivante</li><li>Idempotence (même résultat à chaque exécution)</li><li>Rollback facile</li></ul><h3>Terraform</h3><ul><li><strong>HCL</strong> — HashiCorp Configuration Language</li><li><strong>Provider</strong> — AWS, Azure, GCP, etc.</li><li><strong>State</strong> — fichier qui mémorise l état actuel</li><li><strong>Plan</strong> — aperçu des changements</li><li><strong>Apply</strong> — application réelle</li></ul><h3>Exemple Terraform</h3><pre>provider \"aws\" {\n  region = \"eu-west-3\"\n}\n\nresource \"aws_instance\" \"web\" {\n  ami           = \"ami-123456\"\n  instance_type = \"t3.micro\"\n  tags = {\n    Name = \"web-server\"\n  }\n}</pre><h3>Commandes</h3><pre>terraform init      # initialiser\nterraform plan      # prévisualiser\nterraform apply     # appliquer\nterraform destroy   # supprimer</pre><h3>Sécurité IaC</h3><ul><li><strong>Scanner le code</strong> avant apply (Checkov, tfsec, KICS)</li><li><strong>State file</strong> — sensible, chiffré, jamais sur Git public</li><li><strong>Secrets</strong> — jamais en clair, utiliser Vault, AWS Secrets Manager</li><li><strong>Remote state</strong> — S3 + DynamoDB (lock)</li><li><strong>Plan review</strong> — toujours relire avant apply</li></ul><div class=\"box\">IaC = recette de cuisine. Au lieu de décrire à un cuisinier ce qu il faut faire, vous écrivez la recette. Elle sera la même à chaque fois.</div><div class=\"bank\">Banques : toute infra cloud décrite en Terraform versionné + scan avant deploy. Audit trail en cas d incident.</div><div class=\"warn\">Un State Terraform sur GitHub public = secrets exposés. Chiffrer, isoler, protéger.</div>",
cas:"<h3>Cas 1 — Scanner IaC</h3><pre>checkov -d ./terraform\n# ou\ntfsec ./terraform</pre><p>Résultat : bucket public, chiffrement manquant, SG trop permissif.</p><h3>Cas 2 — State remote</h3><pre>terraform {\n  backend \"s3\" {\n    bucket         = \"my-tfstate\"\n    key            = \"prod/terraform.tfstate\"\n    region         = \"eu-west-3\"\n    dynamodb_table = \"tfstate-lock\"\n    encrypt        = true\n  }\n}</pre><h3>Cas 3 — Variables et secrets</h3><pre>variable \"db_password\" {\n  type      = string\n  sensitive = true\n}\n</pre><p>Passer la valeur via Vault, pas en clair dans le code.</p>",
quiz:[
{q:'IaC signifie ?',o:['Infrastructure as Code','Internet Access Control','Info Access Crypto','Aucun'],c:0,e:'Infrastructure as Code.'},
{q:'Terraform state ?',o:['Sensible','Public','Inutile','Vide'],c:0,e:'Sensible.'}
]},

{id:10, titre:"Sécurité Cloud — 10 bonnes pratiques", intro:"Synthèse : les 10 bonnes pratiques indispensables pour sécuriser une infrastructure cloud bancaire.",
cours:"<h3>Les 10 bonnes pratiques</h3><h4>1. IAM minimum</h4><ul><li>MFA obligatoire</li><li>Moindre privilège</li><li>Pas de compte root</li><li>Rotation des clés</li></ul><h4>2. Chiffrement partout</h4><ul><li>Au repos (AES-256)</li><li>En transit (TLS 1.2+)</li><li>Clés gérées (KMS, HSM)</li></ul><h4>3. Réseau segmenté</h4><ul><li>VPC isolés</li><li>Sous-réseaux publics/privés</li><li>Security Groups restrictifs</li><li>Pas de 0.0.0.0/0 sur SSH</li></ul><h4>4. Logging et monitoring</h4><ul><li>CloudTrail (AWS), Activity Log (Azure)</li><li>SIEM centralisé</li><li>Alertes sur événements suspects</li><li>Rétention 6-12 mois</li></ul><h4>5. Backup et résilience</h4><ul><li>Multi-AZ</li><li>Backup chiffrés</li><li>Test de restauration</li><li>Règle 3-2-1</li></ul><h4>6. Patch management</h4><ul><li>OS à jour</li><li>Images conteneurs scannées</li><li>Dépendances mises à jour</li></ul><h4>7. Scan continu</h4><ul><li>CSPM (config)</li><li>CWPP (workloads)</li><li>Vulnerability scanning</li><li>Container scanning</li></ul><h4>8. Secrets managés</h4><ul><li>Vault, AWS Secrets Manager</li><li>Rotation auto</li><li>Jamais dans le code</li></ul><h4>9. CI/CD sécurisé</h4><ul><li>SAST, DAST, SCA</li><li>Scan images</li><li>Signature d images</li></ul><h4>10. Réponse à incident</h4><ul><li>Plan documenté</li><li>Équipe formée</li><li>Exercices réguliers</li><li>Forensics cloud ready</li></ul><div class=\"box\">Sécuriser le cloud = sécuriser une maison. Porte blindée (IAM), coffre (chiffrement), alarme (monitoring), extincteur (backup), assurance (IR).</div><div class=\"bank\">BCEAO impose : chiffrement des données clients, IAM renforcé, logs centralisés, tests d intrusion annuels, plan de continuité.</div><div class=\"warn\">Le cloud est plus sûr QUE SI configuré correctement. Mal configuré, il est plus vulnérable que l on-premise.</div>",
cas:"<h3>Cas 1 — Checklist bancaire cloud</h3><ul><li>MFA sur tous les comptes</li><li>CloudTrail activé (tous les comptes)</li><li>Chiffrement KMS par défaut</li><li>VPC isolés prod / dev / test</li><li>Aucun bucket public (vérifier CSPM)</li><li>Backup quotidien + test mensuel</li><li>Scan image conteneurs</li><li>Pipeline CI/CD avec scan</li><li>Secrets dans Secrets Manager</li><li>Plan IR testé</li></ul><h3>Cas 2 — Audit rapide</h3><ul><li>AWS Security Hub → score</li><li>Trusted Advisor → recommandations</li><li>IAM Access Analyzer → accès publics</li><li>GuardDuty → menaces</li></ul><h3>Cas 3 — Incident cloud</h3><ol><li>Isoler les ressources compromises</li><li>Capturer les logs (CloudTrail, VPC Flow)</li><li>Révoquer les clés / sessions</li><li>Analyser (forensics cloud)</li><li>Corriger + documenter</li><li>Notifier BCEAO si données affectées</li></ol>",
quiz:[
{q:'MFA ?',o:['Obligatoire','Optionnel','Inutile','Parfois'],c:0,e:'Obligatoire.'},
{q:'Bucket public ?',o:['Normal','Faille','Sûr','Rien'],c:1,e:'Faille.'}
]}
];

function validerQuiz(id) {
  var d = null;
  for (var i = 0; i < DEFIS.length; i++) { if (DEFIS[i].id === id) { d = DEFIS[i]; break; } }
  if (!d) return;
  var correct = 0;
  for (var qi = 0; qi < d.quiz.length; qi++) {
    var q = d.quiz[qi];
    var sel = document.querySelector('input[name="q' + qi + '"]:checked');
    var labels = document.querySelectorAll('.q[data-i="' + qi + '"] label');
    for (var li = 0; li < labels.length; li++) { labels[li].classList.remove('ok','ko'); }
    var e = document.getElementById('exp' + qi); if (e) e.style.display = 'block';
    if (sel && parseInt(sel.value) === q.c) { correct++; labels[q.c].classList.add('ok'); }
    else { labels[q.c].classList.add('ok'); if (sel) labels[parseInt(sel.value)].classList.add('ko'); }
  }
  var u = user();
  if (correct === d.quiz.length) {
    var k = '9_' + id;
    if (!u.done[k]) {
      u.done[k] = true;
      var t = today();
      if (!u.jours[t]) u.jours[t] = [];
      if (u.jours[t].indexOf(k) === -1) u.jours[t].push(k);
    }
  }
  save();
  var r = document.getElementById('qr');
  var pass = correct === d.quiz.length;
  r.className = 'res ' + (pass ? 'g' : 'r');
  r.textContent = pass ? '🎉 ' + correct + '/' + d.quiz.length + ' — Défi validé !' : correct + '/' + d.quiz.length + ' — Réessaie';
  if (pass && id === 10 && isComplete(9)) {
    setTimeout(function(){ alert('🏆 Tu as terminé le Niveau 9 !'); }, 400);
  }
}

  var badges = '';
  for (var i = 0; i < u.certs.length; i++) {
    for (var j = 0; j < CERTS.length; j++) {
      if (CERTS[j].id === u.certs[i]) { badges += '<span class="badge">' + CERTS[j].nom + '</span>'; break; }
    }
  }
  if (!badges) badges = '<span style="color:#94a3b8;font-size:.85rem;font-style:italic">Aucune certification.</span>';
  var defis = '';
  for (var i = 0; i < DEFIS.length; i++) {
    defis += '<li>' + (u.done['9_' + DEFIS[i].id] ? '✓' : '○') + ' ' + DEFIS[i].titre + '</li>';
  }
  var html = '<div class="card" style="background:none;border:none;padding:0">';
  html += '<div class="nav" style="margin-bottom:14px"><button onclick="window.print()">🖨️ PDF</button><button class="sec" onclick="copyCV()">📋 Copier</button></div>';
  html += '<div class="cv-box"><h1>' + u.name.toUpperCase() + '</h1><div class="role">Étudiant L2 UVCI — Aspirant Ingénieur Cloud Security / DevSecOps</div>';
  html += '<h2>Formation</h2><ul><li>Licence 2 — UVCI (Sciences informatiques)</li><li>Mon Drôle Parcours Cyber N1 → N9 (N9 : ' + countDone(9) + '/10)</li></ul>';
  html += '<h2>Compétences</h2><ul><li>Cloud : IaaS, PaaS, SaaS, hybride, multicloud</li><li>IAM, MFA, moindre privilège</li><li>Docker, Kubernetes, RBAC, Network Policies</li><li>CI/CD sécurisé, SAST, DAST, SCA</li><li>Terraform IaC, scan IaC, state remote</li><li>Sécurité cloud, responsabilité partagée</li></ul>';
  html += '<h2>Défis N9 validés</h2><ul>' + defis + '</ul>';
  html += '<h2>Certifications</h2><div>' + badges + '</div>';
  html += '<p style="margin-top:20px;font-size:.72rem;color:#94a3b8;text-align:center;border-top:1px solid #e2e8f0;padding-top:12px">Généré le ' + new Date().toLocaleDateString('fr-FR') + ' · H. N\'GUESSAN ®</p></div></div>';
  document.getElementById('app').innerHTML = html;
}

function copyCV() {
  var u = user(); if (!u) return;
  var t = u.name.toUpperCase() + '\nÉtudiant L2 UVCI — Aspirant Ingénieur Cloud Security / DevSecOps\n\nParcours Cyber N1 à N9\n\nCompétences : IaaS/PaaS/SaaS, IAM, Docker, K8s, CI/CD, Terraform, sécurité cloud\n\nGénéré le ' + new Date().toLocaleDateString('fr-FR');
  if (navigator.clipboard) { navigator.clipboard.writeText(t).then(function(){ alert('CV copié !'); }, function(){ fbCopy(t); }); } else fbCopy(t);
}
function fbCopy(t) { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); alert('CV copié !'); } catch (e) { alert('Copie manuelle'); } document.body.removeChild(ta); }

function renderStats() {
  var u = user(); if (!u) return;
  var t = today();
  var tt = u.jours[t] || [];
  var html = '<div class="card"><h2>📊 Statistiques</h2><div class="stats-grid">';
  html += '<div class="stat"><span class="big">' + countDone(1) + '</span><span class="lbl">N1</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(2) + '</span><span class="lbl">N2</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(3) + '</span><span class="lbl">N3</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(4) + '</span><span class="lbl">N4</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(5) + '</span><span class="lbl">N5</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(6) + '</span><span class="lbl">N6</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(7) + '</span><span class="lbl">N7</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(8) + '</span><span class="lbl">N8</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(9) + '</span><span class="lbl">N9</span></div>';
  html += '</div></div>';
  html += '<div class="card"><h3>🔥 Aujourd hui</h3>';
  if (tt.length === 0) html += '<p style="color:#94a3b8">Aucun défi.</p>';
  else { html += '<ul class="today">'; for (var i = 0; i < tt.length; i++) { html += '<li>✅ ' + tt[i] + '</li>'; } html += '</ul>'; }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

function renderJobs() {
  var html = '<div class="card"><h2>💼 Offres CI</h2><div class="jobs-grid">';
  for (var i = 0; i < JOBS.length; i++) {
    var j = JOBS[i];
    html += '<div class="job"><h4>' + j.t + '</h4><div class="org">' + j.o + ' · ' + j.l + '</div><p>' + j.d + '</p><a href="' + j.u + '" target="_blank">Voir ↗</a></div>';
  }
  html += '</div></div>';
  document.getElementById('app').innerHTML = html;
}

function renderCerts() {
  var u = user();
  var html = '<div class="card"><h2>🎓 Certifications</h2><div class="tabs">';
  html += '<div class="tab active" onclick="filterCerts(this,\'all\')">Toutes</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'free\')">Gratuites</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'paid\')">Payantes</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'done\')">Obtenues</div>';
  html += '</div><div class="certs-grid">';
  for (var i = 0; i < CERTS.length; i++) {
    var c = CERTS[i];
    var isD = u.certs.indexOf(c.id) !== -1;
    html += '<div class="cert-item ' + (c.free ? 'free' : 'paid') + ' ' + (isD ? 'done' : '') + '" data-t="' + (c.free ? 'free' : 'paid') + '" data-d="' + (isD ? '1' : '0') + '">';
    html += '<h4>' + c.nom + '</h4><div class="org">' + c.org + '</div>';
    html += '<div><span class="tag ' + (c.free ? 'free' : 'paid') + '">' + (c.free ? 'GRATUIT' : c.prix) + '</span><span class="tag lvl">' + c.niv + '</span></div>';
    html += '<p>' + c.desc + '</p><a href="' + c.lien + '" target="_blank">Voir ↗</a>';
    html += ' <button class="sec" style="padding:5px 10px;font-size:.74em" onclick="toggleCert(\'' + c.id + '\')">' + (isD ? '✓' : 'Marquer') + '</button>';
    html += '</div>';
  }
  html += '</div></div>';
  document.getElementById('app').innerHTML = html;
}
function filterCerts(el, type) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  el.classList.add('active');
  var items = document.querySelectorAll('.cert-item');
  for (var i = 0; i < items.length; i++) {
    var m = false;
    if (type === 'all') m = true;
    else if (type === 'done') m = items[i].dataset.d === '1';
    else m = items[i].dataset.t === type;
    items[i].style.display = m ? 'block' : 'none';
  }
}
function toggleCert(id) {
  var u = user(); if (!u) return;
  var i = u.certs.indexOf(id);
  if (i === -1) u.certs.push(id); else u.certs.splice(i, 1);
  save(); renderCerts();
}

function renderExamens() {
  var u = user(); if (!u) return;
  var html = '<div class="card"><h2>📝 Examens N9</h2>';
  var types = ['partiel','final'];
  for (var i = 0; i < types.length; i++) {
    var type = types[i];
    var e = EXAMENS[type];
    var passed = u.examens['9_' + type];
    var ready = true;
    for (var j = 0; j < e.req.length; j++) { if (!u.done['9_' + e.req[j]]) { ready = false; break; } }
    var cls = 'exam ' + (passed ? 'passed' : (ready ? '' : 'locked'));
    html += '<div class="' + cls + '"><h4>' + e.titre + '</h4><p style="font-size:.85em;color:#cbd5e1">' + e.desc + '</p>';
    if (passed) html += '<p style="color:#86efac;font-size:.85em">✅ ' + passed + '</p><button class="sec" onclick="go(\'examen/' + type + '\')">Refaire</button>';
    else if (ready) html += '<button class="gold" onclick="go(\'examen/' + type + '\')">Passer</button>';
    else html += '<p style="color:#fbbf24;font-size:.82em">🔒 Défis ' + e.req.join(', ') + '</p>';
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

function renderExamen(type) {
  var u = user(); if (!u) return;
  var e = EXAMENS[type]; if (!e) { go('examens'); return; }
  var ready = true;
  for (var j = 0; j < e.req.length; j++) { if (!u.done['9_' + e.req[j]]) { ready = false; break; } }
  if (!ready) { alert('Valide les défis requis.'); go('examens'); return; }
  var html = '<div class="card"><h2>' + e.titre + '</h2><p style="color:#94a3b8;font-size:.85em">' + e.desc + '</p><div class="quiz">';
  for (var qi = 0; qi < e.qs.length; qi++) {
    var q = e.qs[qi];
    html += '<div class="q" data-i="' + qi + '"><p>Q' + (qi + 1) + '. ' + q.q + '</p>';
    for (var oi = 0; oi < q.o.length; oi++) {
      html += '<label><input type="radio" name="ex' + qi + '" value="' + oi + '"> ' + q.o[oi] + '</label>';
    }
    html += '<div class="exp" id="exexp' + qi + '">' + q.e + '</div></div>';
  }
  html += '<button onclick="validerExamen(\'' + type + '\')">Soumettre</button><div id="er"></div></div></div>';
  document.getElementById('app').innerHTML = html;
}

function validerExamen(type) {
  var u = user(); if (!u) return;
  var e = EXAMENS[type]; if (!e) return;
  var correct = 0;
  for (var qi = 0; qi < e.qs.length; qi++) {
    var q = e.qs[qi];
    var sel = document.querySelector('input[name="ex' + qi + '"]:checked');
    var labels = document.querySelectorAll('.q[data-i="' + qi + '"] label');
    for (var li = 0; li < labels.length; li++) { labels[li].classList.remove('ok','ko'); }
    var ex = document.getElementById('exexp' + qi); if (ex) ex.style.display = 'block';
    if (sel && parseInt(sel.value) === q.c) { correct++; labels[q.c].classList.add('ok'); }
    else { labels[q.c].classList.add('ok'); if (sel) labels[parseInt(sel.value)].classList.add('ko'); }
  }
  var pct = Math.round(correct / e.qs.length * 100);
  var req = type === 'final' ? 80 : 60;
  var pass = pct >= req;
  if (pass) { u.examens['9_' + type] = today(); save(); }
  var r = document.getElementById('er');
  r.className = 'res ' + (pass ? 'g' : 'r');
  r.textContent = pass ? '🎉 ' + correct + '/' + e.qs.length + ' (' + pct + '%)' : correct + '/' + e.qs.length + ' (' + pct + '%) — Il faut ' + req + '%';
}

function b64(s) { try { return btoa(unescape(encodeURIComponent(s))); } catch(e) { return ''; } }
function unb64(b) { try { return decodeURIComponent(escape(atob(b.replace(/\s/g,'')))); } catch(e) { return null; } }
function exportCode() { return b64(JSON.stringify(state)); }
function importCode(c) { var j = unb64(c.trim()); if (!j) return false; try { var d = JSON.parse(j); if (!d) return false; state = Object.assign({}, state, d); save(); return true; } catch(e) { return false; } }
function dlBackup() { var b = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}); var url = URL.createObjectURL(b); var a = document.createElement('a'); a.href = url; a.download = 'mdpc-n9-' + today() + '.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }
function readFile(input) { var f = input.files[0]; if (!f) return; var r = new FileReader(); r.onload = function(e) { try { var d = JSON.parse(e.target.result); state = Object.assign({}, state, d); save(); alert('Restauré !'); route(); } catch(err) { alert('Invalide'); } }; r.readAsText(f); }

function renderSync() {
  var code = exportCode();
  var html = '<div class="card"><h2>🌐 Sync</h2></div>';
  html += '<div class="card"><h3>📋 Code</h3><div class="sync-box"><label>Ton code</label><textarea id="so" readonly onclick="this.select()">' + code + '</textarea><div style="margin-top:8px"><button onclick="copyCode()">Copier</button></div></div>';
  html += '<div class="sync-box"><label>Coller un code</label><textarea id="si" placeholder="Colle ici..."></textarea><div style="margin-top:8px"><button onclick="applyCode()">Restaurer</button></div></div></div>';
  html += '<div class="card"><h3>💾 Fichier</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="dlBackup()">Télécharger</button><input type="file" id="bf" accept=".json" style="display:none" onchange="readFile(this)"><button class="sec" onclick="document.getElementById(\'bf\').click()">Importer</button></div></div>';
  document.getElementById('app').innerHTML = html;
}
function copyCode() { var ta = document.getElementById('so'); ta.select(); try { document.execCommand('copy'); alert('Copié !'); } catch(e) { alert('Manuel'); } }
function applyCode() { var c = document.getElementById('si').value; if (!c.trim()) { alert('Colle un code.'); return; } if (importCode(c)) { alert('Restauré !'); route(); } else alert('Code invalide.'); }

function route() {
  try {
    header();
    if (!state.currentUser) { renderLogin(); return; }
    if (!isUnlocked(9)) { renderLocked(); return; }
    var h = (location.hash || '#home').slice(1);
    var p = h.split('/');
    if (p[0] === 'home' || p[0] === '') return renderHome();
    if (p[0] === 'defi' && p[1]) return renderDefi(parseInt(p[1]));
    if (p[0] === 'certif') return renderCertif();
    if (p[0] === 'cv') return renderCV();
    if (p[0] === 'stats') return renderStats();
    if (p[0] === 'jobs') return renderJobs();
    if (p[0] === 'examens') return renderExamens();
    if (p[0] === 'examen' && p[1]) return renderExamen(p[1]);
    if (p[0] === 'certs') return renderCerts();
    if (p[0] === 'sync') return renderSync();
    renderHome();
  } catch(e) {
    console.error('Route error:', e);
    document.getElementById('app').innerHTML = '<div class="card"><h2 style="color:#ef4444">Erreur</h2><p style="color:#ef4444">' + e.message + '</p><pre style="color:#fca5a5;font-size:.8em;white-space:pre-wrap">' + (e.stack || '') + '</pre></div>';
  }
}
window.addEventListener('hashchange', route);
try { route(); } catch(e) {
  document.getElementById('app').innerHTML = '<div class="card"><h2 style="color:#ef4444">Erreur init</h2><p style="color:#ef4444">' + e.message + '</p></div>';
}
</script>
